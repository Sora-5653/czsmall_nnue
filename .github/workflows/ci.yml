name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: build & test (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        if: matrix.cxx == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build and run the test suite
        run: make test CXX=${{ matrix.cxx }}

      - name: Build the developer tools
        run: make tools CXX=${{ matrix.cxx }}

      - name: Simulator determinism check
        run: |
          ./build/tetra_cli determinism 1
          ./build/tetra_cli determinism 42
          ./build/tetra_cli determinism 123456

      - name: Ruleset hashes
        run: |
          ./build/tetra_cli ruleset league
          ./build/tetra_cli ruleset quickplay
          ./build/tetra_cli ruleset guideline

  sanitizers:
    name: address + undefined sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the suite under ASan/UBSan
        run: make test-asan

  warnings:
    name: warnings are errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with -Werror
        run: make test WARN="-Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wno-sign-conversion -Werror"
