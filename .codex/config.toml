# Project-local lead and worker defaults.
model = "gpt-6-astra"
model_reasoning_effort = "high"

developer_instructions = """
Own architecture, integration, and final verification. Delegate independent, bounded work when it saves time or improves quality; handle small coupled changes directly.
For Luna Max workers, use fork_turns = "none" and provide the task, owned files, relevant context, constraints, acceptance criteria, and checks. Preserve other contributors' changes and avoid overlapping edits. Verify returned changes and evidence before integration.
"""

[features.context_management]
experimental_mode = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[agents.worker]
description = "Luna Max worker for bounded implementation and testing."
config_file = "./agents/worker.toml"
nickname_candidates = ["Worker"]
