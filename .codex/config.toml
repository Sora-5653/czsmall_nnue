# Project-local Codex configuration for cz_nnue.
# Sol acts as the lead/orchestrator; spawned workers default to Luna Max.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"

developer_instructions = """
Act as the lead engineer for this repository.

Own architecture, task decomposition, ambiguous design decisions, integration, and final review.
Delegate bounded implementation, testing, repository exploration, and other clearly specified leaf work to subagents when that saves lead-model work or wall-clock time.

For heterogeneous worker delegation under Multi-Agent V2, use fork_turns = "none" rather than inheriting the full parent history. Put all context the worker needs into the spawn message: exact task, relevant files/interfaces, constraints, acceptance criteria, and tests to run. This is required so the project-level Luna worker defaults can take effect instead of silently inheriting the Sol parent configuration.

Parallelize independent leaf tasks when useful, but avoid multiple workers editing the same files unless coordination is explicit. Do not delegate unresolved architectural choices merely to save tokens. Review returned changes and test results yourself before treating work as integrated or complete.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[agents.worker]
description = "Luna Max implementation worker for bounded coding and testing tasks."
config_file = "./agents/worker.toml"
nickname_candidates = ["Worker"]
